services:
  # -------------------------------------------------------------
  # Persistence: PostgreSQL 16 (Local Database)
  # Internal only: NO published host ports
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: streammart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streammart
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streammart"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  # -------------------------------------------------------------
  # Message Broker: Apache Kafka (Official apache/kafka in KRaft Mode)
  # Internal only: NO published host ports
  # -------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: streammart-kafka
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------
  # Kafka Topic Initializer: Pre-creates all application & DLQ topics
  # -------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: streammart-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-successful --partitions 1 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order-successful --partitions 1 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic email-successful --partitions 1 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-successful.DLQ --partitions 1 --replication-factor 1 &&
       echo 'Kafka topics initialized.'"

  # -------------------------------------------------------------
  # API Gateway: Reverse Proxy & JWT Auth Enforcement
  # THE ONLY SERVICE PUBLISHING A HOST PORT
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
    container_name: streammart-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-streammart-super-secure-jwt-secret-key-32-bytes!}
      - PAYMENT_SERVICE_URL=http://payment-service:8000
      - DEMO_AUTH=true
      - NODE_ENV=development
    depends_on:
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  # -------------------------------------------------------------
  # Payment Service: Transactional Outbox Pattern
  # Internal only: NO published host ports
  # -------------------------------------------------------------
  payment-service:
    build:
      context: ./payment-service
    container_name: streammart-payment
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/streammart
      - KAFKA_BROKERS=kafka:9092
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  # -------------------------------------------------------------
  # Order Service: Idempotent Event Consumer & Order Generator
  # Internal only: NO published host ports
  # -------------------------------------------------------------
  order-service:
    build:
      context: ./order-service
    container_name: streammart-order
    restart: unless-stopped
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/streammart
      - KAFKA_BROKERS=kafka:9092
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8001/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  # -------------------------------------------------------------
  # Email Service: Asynchronous Notification Dispatcher
  # Internal only: NO published host ports
  # -------------------------------------------------------------
  email-service:
    build:
      context: ./email-service
    container_name: streammart-email
    restart: unless-stopped
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/streammart
      - KAFKA_BROKERS=kafka:9092
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8002/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  # -------------------------------------------------------------
  # Analytic Service: Metrics Aggregator
  # Internal only: NO published host ports
  # -------------------------------------------------------------
  analytic-service:
    build:
      context: ./analytic-service
    container_name: streammart-analytic
    restart: unless-stopped
    environment:
      - PORT=8003
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/streammart
      - KAFKA_BROKERS=kafka:9092
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8003/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  postgres_data:
