version: '3.8'

services:
  payment-service:
    build:
      context: ./payment-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BROKERS=kafka:9092
      - NODE_ENV=development


  order-service:
    build:
      context: ./order-service
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}
      - NODE_EXTRA_CA_CERTS=/app/ca.pem
    volumes:
      - ./ca.pem:/app/ca.pem


  email-service:
    build:
      context: ./email-service
    restart: always
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}


  analytic-service:
    build:
      context: ./analytic-service
    restart: always
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}


  client:
    build:
      context: ./client
    ports:
      - "3000:3000"
