name: Microservices CI

on:
  push:
    branches: [ "master", "main", "fix/*" ]
  pull_request:
    branches: [ "master", "main", "fix/*" ]

jobs:
  unit-and-integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies & test API Gateway
        run: |
          cd api-gateway
          npm install
          npm test

      - name: Install dependencies & test Payment Service
        run: |
          cd payment-service
          npm install
          npm test
        env:
          NODE_ENV: test

      - name: Install dependencies & test Order Service
        run: |
          cd order-service
          npm install
          npm test

      - name: Install dependencies & test Email Service
        run: |
          cd email-service
          npm install
          npm test

      - name: Install dependencies & test Analytic Service
        run: |
          cd analytic-service
          npm install
          npm test
